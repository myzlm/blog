<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨韵·云笺 | 古风科技博客</title>
    <!-- 库依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.css">
    <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="skin-default">

    <div class="scanlines"></div>
    <canvas id="particleCanvas"></canvas>
    <canvas id="rippleCanvas"></canvas>
    <canvas id="trailCanvas"></canvas>
    <div class="poem-float" id="poemFloat">☯ 且将新火试新茶，诗酒趁年华 ☯</div>
    <div id="toastContainer"></div>
    <div id="backToTop">⬆</div>

    <div class="style-panel" id="stylePanel">
        <button class="btn skin-btn active" data-skin="default">原版</button>
        <button class="btn skin-btn" data-skin="bamboo">竹简</button>
        <button class="btn skin-btn" data-skin="jade">传国玉玺</button>
    </div>

    <div class="main-container">
        <header class="header">
            <div class="plaque"><h1 class="plaque-title">墨韵·云笺</h1></div>
            <p class="subtitle">✦ 古风为骨 · 科技为翼 ✦</p>
            <div class="user-area" id="userArea">
                <span class="greeting" id="greetingText">未登录·过客</span>
                <button class="btn" id="loginBtn">🔑 登 录</button>
                <button class="btn admin-btn hidden" id="adminPanelBtn">⚙️ 管理</button>
                <button class="btn hidden" id="logoutBtn">🚪 登 出</button>
            </div>
        </header>

        <div class="view active" id="viewList">
            <div class="toolbar" style="display:flex;gap:0.8rem;flex-wrap:wrap;align-items:center;margin-bottom:0.5rem;">
                <input type="text" class="search-box" id="searchInput" placeholder="搜索文章..." style="flex:1;min-width:200px;padding:0.5rem 1rem;background:rgba(30,28,38,0.8);backdrop-filter:blur(10px);border:1px solid var(--border-subtle);border-radius:24px;color:var(--text-primary);outline:none;">
                <div class="tag-filter" id="tagFilter"></div>
            </div>
            <div style="display:flex;justify-content:flex-end;gap:0.5rem;margin-bottom:0.5rem;">
                <button class="btn primary-btn hidden" id="applyArticleBtn">📝 申请发表</button>
                <span id="applyQuota" class="quota-tip hidden" style="font-size:0.8rem;color:var(--cyan-neon);margin-left:0.5rem;"></span>
                <button class="btn primary-btn hidden" id="newArticleBtn">📝 撰写新篇</button>
            </div>
            <div class="articles-grid" id="articlesGrid"></div>
            <div class="empty-state hidden" id="emptyState" style="text-align:center;padding:3rem;color:var(--text-muted);"><span style="font-size:3rem;">📜</span><br>尚无文章，静待墨香</div>
        </div>

        <div class="view" id="viewDetail">
            <button class="btn" id="backToListBtn" style="margin-bottom:1rem;">← 返回卷库</button>
            <div class="article-detail" id="articleDetailContent">
                <div class="detail-halo"></div>
                <button class="btn btn-sm annotate-btn" id="annotateToggle">🖌️ 朱批</button>
            </div>
        </div>

        <div class="view" id="viewAdmin">
            <button class="btn" id="backFromAdminBtn" style="margin-bottom:1rem;">← 返回卷库</button>
            <div class="admin-panel" id="adminPanelContent">
                <div class="admin-header" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.8rem;margin-bottom:1.2rem;">
                    <h3 style="font-family:var(--font-calligraphy);font-size:1.5rem;color:#f0a0a0;">🔰 管理面板</h3>
                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                        <button class="btn primary-btn" id="adminNewArticleBtn">📝 撰写新篇</button>
                        <button class="btn admin-btn" id="articlesTabBtn">📝 文章管理</button>
                        <button class="btn admin-btn" id="reviewTabBtn">📋 待审核(<span id="pendingCount">0</span>)</button>
                        <button class="btn admin-btn" id="quotaTabBtn" style="background:rgba(125,249,255,0.15);border-color:var(--cyan-neon);color:var(--cyan-neon);">⚡ 申请次数</button>
                    </div>
                </div>
                <div id="adminArticlesList"></div>
                <div id="reviewPanel" style="display:none;margin-top:1.5rem;"><h3 style="color:#f0a0a0;">📋 待审核文章</h3><div id="reviewList"></div></div>
                <div id="quotaPanel" style="display:none;margin-top:1.5rem;"><h3 style="color:var(--cyan-neon);">⚡ 成员今日申请次数</h3><div id="quotaList"></div></div>
            </div>
        </div>
    </div>

    <!-- 模态框 -->
    <div class="modal-overlay" id="loginModal"><div class="modal"><button class="close-btn" id="closeLoginModal">&times;</button><h2>🔑 登录云笺</h2><form onsubmit="return false"><div class="input-group"><label>账号</label><input type="text" id="loginUsername" autocomplete="username"></div><div class="input-group"><label>密码</label><input type="password" id="loginPassword" autocomplete="current-password"></div><div class="modal-actions"><button class="btn primary-btn" id="submitLogin">登 录</button></div></form></div></div>
    <div class="modal-overlay" id="articleModal"><div class="modal" style="max-width:640px;"><button class="close-btn" id="closeArticleModal">&times;</button><h2 id="articleModalTitle">📝 撰写文章</h2><form onsubmit="return false"><div class="input-group"><label>标题</label><input type="text" id="articleTitle"></div><div class="input-group"><label>摘要</label><input type="text" id="articleSummary"></div><div class="input-group"><label>标签</label><input type="text" id="articleTags"></div><div class="input-group"><label>印章</label><input type="text" id="articleSeal" maxlength="2" placeholder="墨"></div><div class="input-group"><label>置顶</label><input type="checkbox" id="articlePinned"> 置顶</div><div class="input-group"><label>内容</label><textarea id="articleContent"></textarea></div><div class="modal-actions" style="justify-content:space-between;"><button type="button" class="btn btn-sm" id="importMdBtn">📄 导入 .md</button><div style="display:flex;gap:1rem;"><button class="btn primary-btn" id="submitArticle">发 布</button><button class="btn" id="cancelArticle">取 消</button></div></div><input type="hidden" id="articleEditId"></form></div></div>
    <div class="modal-overlay" id="confirmModal"><div class="modal" style="max-width:400px;text-align:center;"><h2 style="color:#f0a0a0;">⚠️ 确认删除</h2><p>此操作不可恢复</p><div class="modal-actions"><button class="btn btn-danger" id="confirmDeleteBtn">确认删除</button><button class="btn" id="cancelDeleteBtn">取 消</button></div><input type="hidden" id="confirmDeleteId"></div></div>
    <div class="modal-overlay" id="applyModal"><div class="modal" style="max-width:640px;"><button class="close-btn" id="closeApplyModal">&times;</button><h2>📝 申请发表文章</h2><p id="applyLimitInfo"></p><form onsubmit="return false"><div class="input-group"><label>标题</label><input type="text" id="applyTitle"></div><div class="input-group"><label>摘要</label><input type="text" id="applySummary"></div><div class="input-group"><label>标签</label><input type="text" id="applyTags"></div><div class="input-group"><label>印章</label><input type="text" id="applySeal" maxlength="2"></div><div class="input-group"><label>内容</label><textarea id="applyContent"></textarea></div><div class="modal-actions"><button class="btn primary-btn" id="submitApply">提 交</button><button class="btn" id="cancelApply">取 消</button></div></form></div></div>
    <div class="modal-overlay" id="annotationModal"><div class="modal" style="max-width:400px;"><button class="close-btn" id="closeAnnotationModal">&times;</button><h2>🖌️ 朱笔批注</h2><div class="input-group"><label>批注内容</label><input type="text" id="annotationText"></div><div class="modal-actions"><button class="btn primary-btn" id="submitAnnotation">确 定</button></div></div></div>

    <input type="file" id="mdFileInput" accept=".md" style="display:none;">

    <!-- 自定义脚本 -->
    <script src="script.js" defer></script>
</body>
</html>
